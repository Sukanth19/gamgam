[project]
name = "gamgam"
version = "0.1.0"
description = "game recommender + lore q&a (rag, gemini)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-genai>=1.0",
    "chromadb>=0.5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastembed>=0.9.1",
    "mwparserfromhell>=0.7.2",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
